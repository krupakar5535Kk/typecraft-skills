# TypeCraft Universal Agent Compatibility Registry
# Version: 1.2.0
#
# This registry separates:
# - installer availability
# - platform skill compatibility
# - installation verification
#
# Never mark a platform Verified without an actual installation
# and skill-discovery test.

registry_version: "1.1"
project_version: "1.2.0"
canonical_skill:
  name: typecraft-skills
  path: skills/typecraft-skills
  manifest: SKILL.md
  repository: https://github.com/krupakar5535Kk/typecraft-skills.git

verification_levels:
  verified: "TypeCraft files installed and native skill discovery confirmed; invocation is tracked separately."
  compatible: "Official platform documentation describes a supported skill format and install route."
  research_required: "Installation method or compatibility needs investigation."
  unsupported: "No supported persistent skill installation mechanism identified."
  invocation: "Actual skill invocation is recorded independently; an unrecorded invocation is not tested."

installers:
  github_cli:
    name: GitHub CLI Agent Skills
    command: gh skill install
    availability: locally_detected
    preview_tested: true
    preview_tested_count: 48
    preview_tested_method: "Non-installing dry-run; target support is checked against the installed CLI help."
    installation_tested: true
    installation_tested_count: 1
    installation_tested_method: "Actual local GitHub CLI install and skill-list discovery for github-copilot in a temporary project using gh 2.103.3; all 20 references matched by SHA-256, with no GitHub credentials."
    source: https://cli.github.com/manual/gh_skill_install
    supported_agents:
      - github-copilot
      - claude-code
      - cursor
      - codex
      - gemini-cli
      - antigravity
      - antigravity-cli
      - antigravity2.0
      - adal
      - amp
      - augment
      - bob
      - cline
      - codebuddy
      - command-code
      - continue
      - cortex
      - crush
      - deepagents
      - devin
      - droid
      - firebender
      - goose
      - grok
      - iflow-cli
      - junie
      - kilo
      - kimi-cli
      - kiro-cli
      - kode
      - mcpjam
      - mistral-vibe
      - mux
      - neovate
      - openclaw
      - opencode
      - openhands
      - pi
      - pochi
      - qoder
      - qwen-code
      - replit
      - roo
      - trae
      - trae-cn
      - universal
      - warp
      - zencoder

platforms:
  antigravity:
    display_name: Google Antigravity App
    category: ai_ide_and_agent
    product_surface: Antigravity App
    skill_format: agentskills
    compatibility: compatible
    official_documentation_url: https://antigravity.google/docs/skills
    documentation_checked: "2026-11-24"
    verification_environment:
      kind: documentation_review
      environment: "Official Antigravity skills documentation reviewed; Antigravity App was not run and TypeCraft was not installed."
    native_installer_available: false
    file_installation_verification: not_tested
    runtime_discovery_verification: not_tested
    installation:
      method: native_directory
      project_scope_directory: .agents/skills
      user_scope_directory: ~/.gemini/config/skills
    discovery:
      mechanism: "Antigravity App skill list and automatic skill activation"
      user_action: "Inspect the App's skill list or start a fresh session."
    chat_installation:
      possible: conditional
      requirements:
        - repository_access
        - filesystem_access
        - user_permission
    notes: "The App uses .agents/skills for workspace skills and ~/.gemini/config/skills globally. TypeCraft installation and runtime discovery have not been tested."

  antigravity_cli:
    display_name: Antigravity CLI
    category: coding_agent
    product_surface: Antigravity CLI
    skill_format: agentskills
    compatibility: compatible
    official_documentation_url: https://antigravity.google/docs/skills
    documentation_checked: "2026-11-24"
    verification_environment:
      kind: documentation_review
      environment: "Official Antigravity skills documentation reviewed; Antigravity CLI was not run and TypeCraft was not installed."
    native_installer_available: false
    file_installation_verification: not_tested
    runtime_discovery_verification: not_tested
    installation:
      method: native_directory
      project_scope_directory: .agents/skills
      user_scope_directory: ~/.gemini/antigravity-cli/skills
    discovery:
      mechanism: "Skills are converted to slash commands in the interactive TUI; run /skills reload after installing or adding a skill, then invoke /typecraft-skills."
      user_action: "In Antigravity CLI, run /skills reload or start a new conversation and confirm /typecraft-skills is available."
    notes: "Official docs list ~/.gemini/antigravity-cli/skills as CLI-only, ~/.gemini/skills as CLI-readable, and ~/.gemini/config/skills as shared with the App. The adapter prefers the CLI-only user path to keep surface installations distinct. TypeCraft installation and discovery have not been tested."

