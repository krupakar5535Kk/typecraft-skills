    runtime_discovery_verification: verified
    skill_invocation_verification: verified
    installer: github_cli
    installation:
      method: github_cli_managed
      user_scope_directory: ~/.copilot/skills
      project_scope_directory: .github/skills
    runtime_verification:
      agent_id: github-copilot
      tested_at: "2026-11-23"
      skill_version: "1.1.0"
      environment:
        product: GitHub Copilot
        editor: Visual Studio Code
        host: GitHub Codespaces
        session: "Fresh Copilot Agent session"
      installation:
        tested: true
        scope: user
        method: github_cli_managed
        path: /home/codespace/.copilot/skills/typecraft-skills/
        skill_manifest_present: true
        reference_files_present: 20
      skill_discovery:
        tested: true
        result: confirmed
        skill_read: true
      invocation:
        tested: true
        result: confirmed
        references_exercised:
          - Art Deco Typographic Style
          - Swiss International Typographic Style
          - E-commerce Product Showcase Layout
          - Cinematic Title Poster
    discovery:
      mechanism: "VS Code Copilot Agent loads the skill in a fresh session."
      user_action: "This verification applies only to the recorded Codespaces environment."
    evidence:
      - https://docs.github.com/en/copilot/concepts/customizations/agent-skills
      - https://cli.github.com/manual/gh_skill_install
    notes: "Runtime evidence is limited to Copilot Agent mode in VS Code in GitHub Codespaces. Other Copilot surfaces and local installations are separate."

