    display_name: GitHub Copilot CLI
    category: coding_agent
    product_surface: Copilot CLI
    skill_format: agentskills
    compatibility: verified
    official_documentation_url: https://docs.github.com/en/copilot/how-tos/copilot-cli/customize-copilot/add-skills
    documentation_checked: "2026-11-24"
    verification_environment:
      kind: automated_runtime_test
      environment: "Linux GitHub Codespaces; GitHub Copilot CLI 1.0.105; isolated project and HOME; no credentials for install/discovery; a separate one-shot authenticated invocation exercised both named references."
    native_installer_available: true
    file_installation_verification: verified
    runtime_discovery_verification: verified
    skill_invocation_verification: verified
    installation:
      method: documented_skill_directory
      optional_cli_command: "copilot skill add <DIRECTORY> registers an alternate skill location"
      user_scope_directory: ~/.copilot/skills
      project_scope_directory: .github/skills
    discovery:
      mechanism: "copilot skill list or interactive /skills list"
      user_action: "No further action for the tested CLI 1.0.105; reload or restart a running session after installation."
    runtime_verification:
      agent_id: github-copilot-cli
      tested_at: "2026-11-24"
      skill_version: "1.2.0"
      environment:
        product: GitHub Copilot CLI
        host: Linux GitHub Codespaces
        session: "Isolated project/user installation and discovery; separate one-shot model invocation."
        cli_version: "1.0.105"
      installation:
        tested: true
        scope: project
        method: TypeCraft router native directory adapter
        path: "$PROJECT/.github/skills/typecraft-skills/"
        skill_manifest_present: true
        reference_files_present: 20
        sha256_tree_match: true
      skill_discovery:
        tested: true
        result: confirmed
        command: "copilot --no-auto-update skill list --json"
        exact_install_path_matched: true
      invocation:
        tested: true
        result: confirmed
        references_exercised:
          - Swiss International Typographic Style
          - Cinematic Title Poster
    notes: "Automated installation and native discovery passed at both project and user scope. A separate bounded CLI session explicitly invoked /typecraft-skills and correctly used the Swiss style and five-zone poster template. No credentials were used for installation/discovery; invocation used the configured Copilot account."

