native_adapters:
  claude-code:
    platform: claude_code
    scope_paths:
      user: ~/.claude/skills
      project: .claude/skills
    evidence: https://code.claude.com/docs/en/skills
  codex:
    platform: codex
    scope_paths:
      user: ~/.agents/skills
      project: .agents/skills
    evidence: https://learn.chatgpt.com/docs/build-skills
  cursor:
    platform: cursor
    scope_paths:
      user: ~/.agents/skills
      project: .agents/skills
    alternate_scope_paths:
      user:
        - ~/.cursor/skills
        - ~/.claude/skills
        - ~/.codex/skills
      project:
        - .cursor/skills
        - .claude/skills
        - .codex/skills
    evidence: https://cursor.com/docs/skills
  gemini-cli:
    platform: gemini_cli
    scope_paths:
      user: ~/.gemini/skills
      project: .gemini/skills
    alternate_scope_paths:
      user:
        - ~/.agents/skills
      project:
        - .agents/skills
    evidence: https://geminicli.com/docs/cli/skills/
  opencode:
    platform: opencode
    scope_paths:
      user: ~/.agents/skills
      project: .agents/skills
    alternate_scope_paths:
      user:
        - ~/.config/opencode/skills
        - ~/.claude/skills
        - ~/.codex/skills
      project:
        - .opencode/skills
        - .claude/skills
        - .codex/skills
    evidence: https://opencode.ai/docs/skills/
  antigravity:
    platform: antigravity
    scope_paths:
      user: ~/.gemini/config/skills
      project: .agents/skills
    evidence: https://antigravity.google/docs/skills
  antigravity-cli:
    platform: antigravity_cli
    scope_paths:
      user: ~/.gemini/antigravity-cli/skills
      project: .agents/skills
    alternate_scope_paths:
      user:
        - ~/.gemini/config/skills
        - ~/.gemini/skills
    evidence: https://antigravity.google/docs/skills
  github-copilot-cli:
    platform: github_copilot_cli
    scope_paths:
      user: ~/.copilot/skills
      project: .github/skills
    alternate_scope_paths:
      user:
        - ~/.agents/skills
      project:
        - .agents/skills
    evidence: https://docs.github.com/en/copilot/how-tos/copilot-cli/customize-copilot/add-skills

runtime_detection:
  environment_variable: TYPECRAFT_AGENT
  automatic_detection_requires_explicit_host_identity: true
  do_not_guess_from_installed_applications_or_paths: true

fallbacks:
  chat-only:
    persistent_installation: unsupported
    user_action: "For temporary use, ask the agent to read the canonical skill files in this repository for the current conversation."
    notes: "A chat-only agent without repository/filesystem access cannot install or persist a skill."

