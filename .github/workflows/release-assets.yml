name: Release Assets

on:
  release:
    types:
      - published
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to build and attach assets to (e.g. 1.4.0 or v1.4.0)'
        required: false
        default: '1.4.0'

permissions:
  contents: write

jobs:
  build-and-upload:
    name: Build and Upload Release Assets
    runs-on: ubuntu-latest
    env:
      PYTHONUTF8: "1"

    steps:
      - name: Determine target release tag
        id: resolve-tag
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ "${{ github.event_name }}" = "release" ]; then
            TAG="${{ github.event.release.tag_name }}"
          else
            TAG="${{ github.event.inputs.tag }}"
            if [ -z "$TAG" ]; then
              TAG="${{ github.ref_name }}"
            fi
          fi

          # Resolve matching release tag (handles 'v1.4.0' vs '1.4.0')
          if gh release view "$TAG" >/dev/null 2>&1; then
            TARGET_TAG="$TAG"
          elif gh release view "v$TAG" >/dev/null 2>&1; then
            TARGET_TAG="v$TAG"
          elif gh release view "${TAG#v}" >/dev/null 2>&1; then
            TARGET_TAG="${TAG#v}"
          else
            TARGET_TAG="$TAG"
          fi

          echo "tag=$TARGET_TAG" >> "$GITHUB_OUTPUT"
          echo "Selected release tag: $TARGET_TAG"

      - name: Checkout repository at release tag
        uses: actions/checkout@v7
        with:
          ref: ${{ steps.resolve-tag.outputs.tag }}

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-installer.txt

      - name: Build and verify canonical release ZIP
        run: |
          python -m scripts.install_url \
            --request "https://github.com/krupakar5535Kk/typecraft-skills.git" \
            --agent chatgpt \
            --package-output typecraft-skills.zip \
            --force

      - name: Generate and verify SHA-256 checksum
        run: |
          sha256sum typecraft-skills.zip > SHA256SUMS
          sha256sum -c SHA256SUMS
          cat SHA256SUMS

      - name: Upload assets to GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload "${{ steps.resolve-tag.outputs.tag }}" \
            typecraft-skills.zip SHA256SUMS \
            --clobber
