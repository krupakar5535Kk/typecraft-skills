name: Validate TypeCraft Skills

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Validate Skill, Resources and Agent Installer
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Create validation environment
        run: python -m venv .venv

      - name: Install validation dependencies
        run: |
          .venv/bin/python -m pip install --upgrade pip
          .venv/bin/python -m pip install "git+https://github.com/agentskills/agentskills.git@83021e2be457a9b6679148719c1f6074f0ad975e#subdirectory=skills-ref"

      - name: Validate resource library
        run: .venv/bin/python scripts/validate_resources.py

      - name: Validate Agent Skill
        run: .venv/bin/python scripts/validate_skill.py

      - name: Validate agent registry
        run: .venv/bin/python scripts/validate_agent_registry.py

      - name: Check Python syntax
        run: |
          .venv/bin/python -m py_compile scripts/install.py scripts/install_url.py
          .venv/bin/python -m py_compile scripts/validate_agent_registry.py scripts/validate_skill.py

      - name: Test agent listing
        run: .venv/bin/python scripts/install.py --list

      - name: Test installer inventory matching
        run: .venv/bin/python -m unittest discover -s tests -v

      - name: Test all 48 agent installation previews
        run: .venv/bin/python scripts/install.py --all --dry-run

      - name: Check shell installer syntax
        run: bash -n scripts/install_all_agents.sh
