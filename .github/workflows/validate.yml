name: Validate TypeCraft Skills

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Validate (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
          - windows-latest
    runs-on: ${{ matrix.os }}
    env:
      PYTHONUTF8: "1"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install validation dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-installer.txt
          python -m pip install "git+https://github.com/agentskills/agentskills.git@83021e2be457a9b6679148719c1f6074f0ad975e#subdirectory=skills-ref"

      - name: Validate resource library
        run: python scripts/validate_resources.py

      - name: Validate Agent Skill
        run: python scripts/validate_skill.py

      - name: Validate agent registry
        run: python scripts/validate_agent_registry.py

      - name: Check Python syntax
        run: |
          python -m py_compile scripts/install.py scripts/install_url.py
          python -m py_compile scripts/validate_agent_registry.py scripts/validate_resources.py scripts/validate_skill.py
          python -m py_compile tests/test_gemini_cli_integration.py tests/test_copilot_cli_integration.py tests/test_opencode_cli_integration.py tests/test_codex_plugin_integration.py

      - name: Test agent listing
        run: python scripts/install.py --list

      - name: Run complete unit suite
        run: python -m unittest discover -s tests -v

      - name: Set up Node.js for CLI integrations
        if: runner.os == 'Linux'
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Test Gemini CLI installation and discovery
        if: runner.os == 'Linux'
        run: python tests/test_gemini_cli_integration.py

      - name: Set up Copilot CLI for integration
        if: runner.os == 'Linux'
        run: npm install --prefix "$RUNNER_TEMP/copilot-cli" --no-save @github/copilot@1.0.114

      - name: Test Copilot CLI installation and discovery
        if: runner.os == 'Linux'
        run: |
          PATH="$RUNNER_TEMP/copilot-cli/node_modules/.bin:$PATH" \
            python tests/test_copilot_cli_integration.py

      - name: Set up OpenCode CLI for integration
        if: runner.os == 'Linux'
        run: |
          npm install --prefix "$RUNNER_TEMP/opencode-cli" --no-save --ignore-scripts --no-audit --no-fund opencode-ai@1.19.6
          node "$RUNNER_TEMP/opencode-cli/node_modules/opencode-ai/postinstall.mjs"
          echo "$RUNNER_TEMP/opencode-cli/node_modules/.bin" >> "$GITHUB_PATH"

      - name: Test OpenCode installation, integrity, and discovery
        if: runner.os == 'Linux'
        run: python tests/test_opencode_cli_integration.py

      - name: Set up Codex CLI for plugin integration
        if: runner.os == 'Linux'
        run: npm install --prefix "$RUNNER_TEMP/codex-cli" --no-save --ignore-scripts --no-audit --no-fund @openai/codex@0.172.0

      - name: Test Codex plugin installation, integrity, and discovery
        if: runner.os == 'Linux'
        run: |
          PATH="$RUNNER_TEMP/codex-cli/node_modules/.bin:$PATH" \
            python tests/test_codex_plugin_integration.py

      - name: Preview every advertised GitHub CLI host
        run: python scripts/install.py --all --dry-run

      - name: Check shell installer syntax
        run: bash -n scripts/install_all_agents.sh
        if: runner.os != 'Windows'
