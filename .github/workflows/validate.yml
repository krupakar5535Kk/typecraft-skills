
name: Validate TypeCraft Skills

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Validate Skill and Resources
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Create validation environment
        run: python -m venv .venv

      - name: Install validation dependencies
        run: |
          .venv/bin/python -m pip install --upgrade pip
          .venv/bin/python -m pip install skills-ref==0.1.0 strictyaml

      - name: Validate resource library
        run: .venv/bin/python scripts/validate_resources.py

      - name: Validate Agent Skill
        run: .venv/bin/agentskills validate skills/typecraft-skills
